[project]
name = "factor-investor"
version = "0.1.0"
description = "Research framework for backtesting equity strategies on Nordic data from Börsdata"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Database
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Data processing
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "scipy>=1.11",
    "numba>=0.60",
    # Configuration
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "tomli>=2.0",
    # HTTP client
    "httpx>=0.27",
    "tenacity>=8.0",
    # CLI
    "typer>=0.12",
    "rich>=13.0",
    # Optimization
    "optuna>=3.6",
    # Reporting
    "plotly>=5.22",
    # Utilities
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    # Type stubs
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]

[project.scripts]
factor-investor = "factor_investor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factor_investor"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented out code)
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for typer)
]

[tool.ruff.lint.isort]
known-first-party = ["factor_investor"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "numba.*",
    "optuna.*",
    "plotly.*",
    "duckdb.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    # slow tests run explicitly: pytest -m slow (make test-slow)
    "-m",
    "not slow",
]
markers = [
    "slow: slow database tests, excluded by default; run with -m slow",
    "integration: marks tests requiring database",
    "integrity: marks lookahead/survivorship bias tests",
]

[tool.coverage.run]
source = ["src/factor_investor"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
