id: piotroski
name: "Piotroski F-Score (Simplified)"
family: quality_stability
description: |
  Simplified 6-point fundamental strength score based on Piotroski (2000).

  Each component scores 0 or 1, summed to 0-6.
  Higher scores indicate stronger fundamental quality.

  Original F-Score has 9 components, but simplified to 6 based on available metrics.

  Original paper: "Value Investing: The Use of Historical Financial Statement
  Information to Separate Winners from Losers" (Piotroski, 2000)

components:
  # ============================================================================
  # PROFITABILITY (2 points)
  # ============================================================================

  - id: f1_positive_roe
    metric: roe_level_raw
    condition: "> 0"
    weight: 1
    description: "Positive return on equity (ROE > 0)"
    category: profitability

  - id: f2_positive_ocf
    metric: cash_flow_from_operating_activities_level_raw
    condition: "> 0"
    weight: 1
    description: "Positive operating cash flow (OCF > 0)"
    category: profitability

  - id: f3_roe_increase
    metric: roe_level_raw
    condition: "change_1y > 0"
    weight: 1
    description: "ROE increased year-over-year (ΔROE > 0)"
    category: profitability

  # ============================================================================
  # LEVERAGE / LIQUIDITY (1 point)
  # ============================================================================

  - id: f4_current_ratio_increase
    metric: current_ratio_level_raw
    condition: "change_1y > 0"
    weight: 1
    description: "Current ratio increased (ΔCurrent Ratio > 0)"
    category: leverage

  # ============================================================================
  # OPERATING EFFICIENCY (2 points)
  # ============================================================================

  - id: f5_margin_increase
    metric: gross_margin_level_raw
    condition: "change_1y > 0"
    weight: 1
    description: "Gross margin increased (ΔMargin > 0)"
    category: efficiency

  - id: f6_turnover_increase
    metric: asset_turnover_level_raw
    condition: "change_1y > 0"
    weight: 1
    description: "Asset turnover increased (ΔTurnover > 0)"
    category: efficiency

# Minimum required components to calculate score
# (require at least 5 out of 6 components)
min_components_required: 5

# Score interpretation (adjusted for 6-point scale)
score_ranges:
  - range: [0, 1]
    label: "Very Weak"
    description: "Severe fundamental deterioration"

  - range: [2, 3]
    label: "Weak"
    description: "Poor fundamental quality"

  - range: [4, 4]
    label: "Moderate"
    description: "Mixed fundamental signals"

  - range: [5, 5]
    label: "Strong"
    description: "Good fundamental quality"

  - range: [6, 6]
    label: "Very Strong"
    description: "Excellent fundamental quality across all dimensions"

# Historical performance notes
notes: |
  Simplified version of Piotroski (2000) F-Score adapted for available metrics.

  Original F-Score components not included:
  - Accrual quality (OCF > Net Income) - net income metric not available as level
  - Debt decrease - net debt not available as level metric
  - No dilution - shares outstanding not available as level metric

  This simplified version focuses on:
  - Profitability: ROE levels and changes, operating cash flow
  - Liquidity: Current ratio improvement
  - Efficiency: Margin and asset turnover improvements

  Nordic market considerations:
  - May need adjustment for different accounting standards
  - Smaller universe may reduce statistical significance
  - Consider sector-specific variations
