# H6 magic formula with the daily clock (ablation), pre-registered 2026-10-30: as
# magic_formula_v1 with top 20, quarterly, market cap >= 500 MSEK, plus:
#   timing: none / price above its 200-day mean / 50-day breakout (new positions wait for it)
#   exits: none / trailing stop 20% / 30% below the high since entry (checked daily)
#   sell_on_rank: true / false (only exits sell)
# 3 x 3 x 2 = 18 configurations; none, none, true is the plain strategy.
# Never edit after a logged run: create _v2 instead.
id: magic_formula_daily_v1
hypothesis: H6
description: Magic formula, top 20, quarterly, market cap >= 500 MSEK, with daily timing and exits (ablation)
area: SE
rebalance: quarterly
cost_bps: 10
universe:
- component: expression_v1
  params:
    expression: turnover >= 1000000 and sector_id != 1 and sector_id != 10
- component: expression_v1
  params:
    expression: market_cap >= 500000000
scoring:
  min_coverage: 1.0
  blocks:
  - component: percentile_v1
    params:
      metric: ev_ebit
      higher_is_better: false
      non_positive_is_worst: true
    weight: 1
  - component: percentile_v1
    params:
      metric: roic_pretax
    weight: 1
portfolio:
  component: top_n_hysteresis_v1
  params:
    top_n: 20
    sell_rank: 1.0
timing:
  search:
    none: []
    ma200:
    - component: price_above_ma_v1
      params:
        days: 200
    breakout50:
    - component: breakout_v1
      params:
        days: 50
exits:
  search:
    none: []
    stop20:
    - component: trailing_stop_v1
      params:
        pct: 0.2
    stop30:
    - component: trailing_stop_v1
      params:
        pct: 0.3
sell_on_rank:
  search:
  - true
  - false
