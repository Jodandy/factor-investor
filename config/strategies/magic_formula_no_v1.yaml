# H6 magic formula in NO, pre-registered 2026-10-30:
# as magic_formula_v1 with turnover >= 1,000,000 NOK a day and market cap >= 500,000,000 / 2,000,000,000 NOK.
# Never edit after a logged run: create _v2 instead.
id: magic_formula_no_v1
hypothesis: H6
description: Magic formula (EV/EBIT and pretax ROIC, equal rank weight), Sweden
area: 'NO'
rebalance:
  search:
  - annual
  - quarterly
cost_bps: 10
universe:
- component: expression_v1
  params:
    expression: turnover >= 1000000 and sector_id != 1 and sector_id != 10
- component: expression_v1
  params:
    expression:
      search:
        mcap_small: market_cap >= 500000000
        mcap_large: market_cap >= 2000000000
scoring:
  min_coverage: 1.0
  blocks:
  - component: percentile_v1
    params:
      metric: ev_ebit
      higher_is_better: false
      non_positive_is_worst: true
    weight: 1
  - component: percentile_v1
    params:
      metric: roic_pretax
    weight: 1
portfolio:
  component: top_n_hysteresis_v1
  params:
    top_n:
      search:
      - 20
      - 30
    sell_rank: 1.0
