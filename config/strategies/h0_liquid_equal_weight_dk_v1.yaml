# H0 control for H2 in DK: same as h0_liquid_equal_weight_v1 except area DK and
# turnover >= 700,000 DKK a day (about 1 MSEK). Pre-registered 2026-10-29.
# Never edit after a logged run: create _v2 instead.
id: h0_liquid_equal_weight_dk_v1
hypothesis: H0
description: Equal weight, investable DK with turnover >= 1 MDKK/day (control for H2's liquidity filter)
area: DK
rebalance:
  search:
  - quarterly
  - semiannual
cost_bps: 10
universe:
- component: expression_v1
  params:
    expression: turnover >= 700000
scoring:
  blocks:
  - component: constant_v1
    weight: 1
portfolio:
  component: top_n_hysteresis_v1
  params:
    top_n: 100000
    sell_rank: 1.0
