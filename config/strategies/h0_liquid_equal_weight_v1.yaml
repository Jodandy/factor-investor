# H0 control: equal weight over every investable Swedish company with median
# turnover >= 1 MSEK a day, no selection. The reference for H2 (same liquidity
# filter, same rebalancing). Never edit after a logged run: create _v2 instead.
id: h0_liquid_equal_weight_v1
hypothesis: H0
description: Equal weight, investable SE with turnover >= 1 MSEK/day (control for H2's liquidity filter)
area: SE
rebalance:
  search:
  - quarterly
  - semiannual
cost_bps: 10
universe:
- component: expression_v1
  params:
    expression: turnover >= 1000000
scoring:
  blocks:
  - component: constant_v1
    weight: 1
portfolio:
  component: top_n_hysteresis_v1
  params:
    top_n: 100000
    sell_rank: 1.0
