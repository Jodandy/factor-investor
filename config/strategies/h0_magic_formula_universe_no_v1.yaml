# H0 control for H6 in NO, pre-registered 2026-10-30:
# as h0_magic_formula_universe_v1 with turnover >= 1,000,000 NOK a day and market cap >= 500,000,000 / 2,000,000,000 NOK.
# Never edit after a logged run: create _v2 instead.
id: h0_magic_formula_universe_no_v1
hypothesis: H0
description: Equal weight over the magic formula universe (control for H6)
area: 'NO'
rebalance:
  search:
  - annual
  - quarterly
cost_bps: 10
universe:
- component: expression_v1
  params:
    expression: turnover >= 1000000 and sector_id != 1 and sector_id != 10
- component: expression_v1
  params:
    expression:
      search:
        mcap_small: market_cap >= 500000000
        mcap_large: market_cap >= 2000000000
scoring:
  blocks:
  - component: constant_v1
    weight: 1
portfolio:
  component: top_n_hysteresis_v1
  params:
    top_n: 100000
    sell_rank: 1.0
