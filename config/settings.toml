[database]
url = "${DATABASE_URL}"

[paths]
data_dir = "data"
cache_dir = "data/cache"
parquet_dir = "data/parquet"
raw_json_dir = "data/raw"

[defaults]
base_currency = "SEK"

# Conservative fallback delays for report publication dates (calendar days)
# Used when actual publication date is not available in the data
[report_delays]
quarterly = 60  # Period end + 60 days
annual = 90     # Period end + 90 days
min_publication_days = 10  # Earlier report_date is treated as missing (placeholder)
trading_day_buffer = 1  # Additional buffer to prevent same-day trading

[instruments]
# Börsdata instrument types (meanings inferred from names, see DATA_AUDIT
# "Instrument Types"). Other types (1 pref, 7 commodity, 8 SPAC, 10 unit,
# 12 crypto) are not synced.
stock_types = [0, 3, 9]  # ordinary shares, second share classes, ADRs
price_only_types = [2, 4, 5, 6, 11, 13]  # indices and FX: benchmarks, never eligible

[dividends]
# Ex-date estimate for report dividends without a dividend calendar entry
# (Nordics before 2010, other countries before 2015): known_from + lag days.
# Medians of (first calendar ex-date - known_from) per country over 2010-2026,
# countries with >= 500 observations (DECISIONS 2026-10-29).
fallback_lag_days = 63
[dividends.fallback_lag_days_by_country]
1 = 77    # Sweden
2 = 71    # Norway
3 = 50    # Finland
4 = 38    # Denmark
5 = 32    # USA
6 = 22    # Canada
7 = 57    # England
8 = 97    # Germany
9 = 111   # France
10 = 104  # Spain
12 = 97   # Italy
13 = 60   # Switzerland
14 = 97   # Belgium
15 = 75   # Netherlands
17 = 139  # Poland

[universe]
# PHILOSOPHY: Universe = all instruments with sufficient data quality
# NO geographic filters, NO market cap cutoffs, NO liquidity requirements
# Strategies apply their own selection criteria at backtest time

# No minimum price: prices are split-adjusted, so a threshold would exclude
# stocks based on splits made later (DECISIONS 2026-10-29). Set min_price here
# only to opt in.

# Preference-like share classes (Swedish property companies' D shares)
exclude_name_suffixes = [" D"]

# Snapshot price = last close on or before the snapshot date, at most this many
# calendar days old (covers weekends and holidays such as Nordic Dec 31)
max_price_age_days = 7

# Excluded countries (country ids)
exclude_country_ids = []

# Liquidity buckets (for transaction cost modeling - informational, not exclusionary)
# These thresholds are used to classify instruments, not exclude them
liquidity_bucket_thresholds = [
    10_000_000.0,  # >= 10M daily turnover = bucket 1 (most liquid)
    1_000_000.0,   # >= 1M = bucket 2
    100_000.0,     # >= 100k = bucket 3
    10_000.0,      # >= 10k = bucket 4
    # < 10k = bucket 5 (least liquid)
]

# Countries where only domestic companies are eligible: country id -> ISIN
# country code. 8 = Germany: mostly secondary listings of foreign companies
# (4,326 of 6,094 report in non-EUR currencies); German companies stay in.
[universe.domestic_only]
8 = "DE"

[corporate_events]
# Recovery rate assumptions for detected delistings
default_delisting_recovery = 1.0  # Optimistic: assume acquisition at final price

[backtest]
# Execution delay: signal on day T, execute on day T+N
execution_delay_days = 1

[costs]
# Default cost model reference
default_model = "costs.yaml"
