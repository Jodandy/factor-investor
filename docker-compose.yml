services:
  db:
    image: postgres:16-alpine
    container_name: factor-investor-db
    restart: unless-stopped
    # Docker's default 64 MB /dev/shm is too small for several parallel
    # backtests querying at once ("could not resize shared memory segment")
    shm_size: 1gb
    environment:
      POSTGRES_USER: factor
      POSTGRES_PASSWORD: factor_dev
      POSTGRES_DB: factor_investor
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factor -d factor_investor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
